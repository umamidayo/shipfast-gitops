name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize overlays
        run: |
          for overlay in deploy/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay"
            echo "::endgroup::"
          done
      - uses: opentofu/setup-opentofu@v1
      - name: OpenTofu fmt + validate
        working-directory: infra
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

  # On main: build the image, push it to GHCR, and pin the new tag in
  # deploy/overlays/ghcr. Argo CD (if pointed at that overlay) deploys it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, validate]
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only app/ changes produce a new image. (The bot's own overlay commit
      # doesn't retrigger this workflow: pushes made with GITHUB_TOKEN never do.)
      - name: Did app/ change?
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" != 0000000000000000000000000000000000000000 ]] \
             && git diff --quiet "$before" "$GITHUB_SHA" -- app; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image name
        if: steps.changes.outputs.app == 'true'
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/status-check" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.changes.outputs.app == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.app == 'true'
        with:
          context: app
          push: true
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Pin image in deploy/overlays/ghcr
        if: steps.changes.outputs.app == 'true'
        working-directory: deploy/overlays/ghcr
        run: |
          kustomize edit set image status-check=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(ghcr): status-check ${{ steps.meta.outputs.tag }}"
          git push
